[project]
name = "urecamatch-api"
version = "0.1.0"
description = "URECAMatch API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "supabase>=2.7",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "resend>=2.0",
    "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "fastapi-cli>=0.0.5",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042"]  # str-Enum mixins are what Pydantic and OpenAPI need

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"app/db/seed_data.py" = ["E501"]
